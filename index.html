<!-- ✅ Firebase Messaging Service Worker Registration (added) -->
<script>
  if ('serviceWorker' in navigator) {
    const swPath = window.location.hostname === 'localhost'
      ? '/firebase-messaging-sw.js'
      : '/firebase-messaging-sw.js'; // Adjust if hosted in a subfolder

    navigator.serviceWorker.register(swPath)
      .then((registration) => {
        console.log('✅ [index.html] Service Worker registered with scope:', registration.scope);
      })
      .catch((err) => {
        console.error('❌ [index.html] Service Worker registration failed:', err);
      });
  } else {
    console.warn('⚠️ Service Workers are not supported in this browser.');
  }
</script>

<!-- green color button -->
<script>
  let audioContext, analyser, mic;

  function startMicVolumeListener(callback) {
    navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      mic = audioContext.createMediaStreamSource(stream);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;

      let dataArray = new Uint8Array(analyser.frequencyBinCount);
      mic.connect(analyser);

      function updateVolume() {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        let volume = sum / dataArray.length;
        callback(volume); // Pass volume back to Dart
        requestAnimationFrame(updateVolume);
      }

      updateVolume();
    }).catch(err => console.error('Mic access denied', err));
  }
</script>

<!-- waveform button -->
<canvas id="micWaveCanvas" width="200" height="100" style="display:none; position: absolute; left: 50%; transform: translateX(-50%); bottom: 100px;"></canvas>

<script>
  let audioContextWave, analyserWave, dataArrayWave, sourceWave, micStream;
  const canvas = document.getElementById('micWaveCanvas');
  const ctx = canvas.getContext('2d');

  function startWaveformStream() {
    navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
      micStream = stream;
      audioContextWave = new (window.AudioContext || window.webkitAudioContext)();
      analyserWave = audioContextWave.createAnalyser();
      sourceWave = audioContextWave.createMediaStreamSource(stream);
      sourceWave.connect(analyserWave);
      analyserWave.fftSize = 256;

      const bufferLength = analyserWave.frequencyBinCount;
      dataArrayWave = new Uint8Array(bufferLength);

      canvas.style.display = 'block';

      drawWaveform();
    }).catch((err) => {
      console.error('Mic error:', err);
    });
  }

  function drawWaveform() {
    requestAnimationFrame(drawWaveform);

    analyserWave.getByteTimeDomainData(dataArrayWave);

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.lineWidth = 2;
    ctx.strokeStyle = '#00ff00';
    ctx.beginPath();

    const sliceWidth = canvas.width / dataArrayWave.length;
    let x = 0;
    for (let i = 0; i < dataArrayWave.length; i++) {
      const v = dataArrayWave[i] / 128.0;
      const y = (v * canvas.height) / 2;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      x += sliceWidth;
    }

    ctx.lineTo(canvas.width, canvas.height / 2);
    ctx.stroke();
  }

  function stopWaveformStream() {
    canvas.style.display = 'none';
    if (micStream) {
      micStream.getTracks().forEach(track => track.stop());
    }
    if (audioContextWave) {
      audioContextWave.close();
    }
  }

  window.startWaveformStream = startWaveformStream;
  window.stopWaveformStream = stopWaveformStream;
</script>
